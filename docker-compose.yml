services:
  syncorbit:
    build: .
    container_name: syncorbit
    ports:
      - '5010:5010'
    volumes:
      - ${MEDIA_PATH}:/app/media:ro
      - ${TV_MEDIA_PATH}:/app/media_tv:ro
      - ${DATA_PATH}:/app/data
    environment:
      - SYNCORBIT_DATA=/app/data
      # Uncomment when running the optional WhisperX container:
      # - WHISPERX_URL=http://whisperx:8000
    restart: unless-stopped